name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.9.0

      - name: Vérifier l'installation
        run: |
          python -c "import cv2, mediapipe, customtkinter, numpy; print('Dépendances OK')"
          python -m py_compile main.py motion_engine/*.py interface/*.py

      - name: Compiler l'exécutable (one-file)
        run: pyinstaller --clean --noconfirm MotionControl.spec

      - name: Vérifier l'exécutable
        run: |
          if (Test-Path "dist/MotionControl.exe") {
            Write-Host "MotionControl.exe généré avec succès"
            Get-Item "dist/MotionControl.exe" | Select-Object Name, Length
          } else {
            Write-Error "MotionControl.exe introuvable"
          }
        shell: pwsh

      - name: Renommer l'artefact
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '[^A-Za-z0-9._-]', '_'
          Copy-Item "dist/MotionControl.exe" "dist/MotionControl-win64-$tag.exe"
        shell: pwsh

      - name: Téléverser l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: MotionControl-win64
          path: dist/MotionControl-win64-*.exe
          if-no-files-found: error

      - name: Publier dans la Release (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MotionControl-win64-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
