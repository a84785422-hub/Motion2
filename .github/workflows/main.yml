name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: motion-control

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.11 (x64)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Vérifier les fichiers du projet
        shell: pwsh
        run: |
          if (!(Test-Path 'main.py')) { throw 'main.py absent de motion-control/' }
          if (!(Test-Path 'requirements.txt')) { throw 'requirements.txt absent de motion-control/' }
          if (!(Test-Path 'MotionControl.spec')) { throw 'MotionControl.spec absent de motion-control/' }
          Write-Host 'Structure du projet OK'
          Get-Location

      - name: Installer les dépendances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller==6.9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vérifier OpenCV et MediaPipe
        shell: pwsh
        run: |
          python -c "import sys; print('Python:', sys.executable); import cv2; print('OpenCV:', cv2.__version__); import mediapipe as mp; print('MediaPipe:', mp.__version__); import customtkinter, numpy; print('Toutes les dépendances sont présentes')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vérifier la syntaxe Python
        shell: pwsh
        run: |
          python -m py_compile main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import compileall, sys; ok = compileall.compile_dir('motion_engine', quiet=1) and compileall.compile_dir('interface', quiet=1); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compiler MotionControl.exe
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm MotionControl.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vérifier l'exécutable
        shell: pwsh
        run: |
          $exe = 'dist/MotionControl.exe'
          if (!(Test-Path $exe)) { throw 'La compilation est terminée mais dist/MotionControl.exe est absent.' }
          Get-Item $exe | Select-Object Name, Length

      - name: Préparer le nom de l'artefact
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '[^A-Za-z0-9._-]', '_'
          Copy-Item 'dist/MotionControl.exe' "dist/MotionControl-win64-$tag.exe"

      - name: Téléverser l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: MotionControl-win64
          path: motion-control/dist/MotionControl-win64-*.exe
          if-no-files-found: error

      - name: Publier dans la Release (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: motion-control/dist/MotionControl-win64-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
